name: Release Disk Map

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        run: make ui

      - name: Package the release
        run: ./distribution/package-release.sh

      # Inserire qui la firma Developer ID e la notarizzazione prima della
      # prima release pubblica. Non pubblichiamo build firmate ad-hoc.
      - name: Publish GitHub Release
        if: ${{ vars.RELEASE_SIGNING_READY == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
